  ios-release-ipa:
    name: Remont Asystent 1.2.0 — iOS Store Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store
      vars:
        BUNDLE_ID: app.replit.remontasystent
        APP_STORE_APPLE_ID: "6761497453"
        CI: "1"
      node: 22.19.0
      xcode: 26.6
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pnpm-store
        - $HOME/.npm
    scripts:
      - name: Install exact workspace dependencies
        script: |
          npm install -g pnpm@10.17.1
          cd "$CM_BUILD_DIR"
          pnpm install --frozen-lockfile
      - name: Validate mobile TypeScript
        script: |
          cd "$CM_BUILD_DIR"
          pnpm exec tsc --build lib/pricing-service/tsconfig.json
          pnpm --filter @workspace/mobile typecheck
      - name: Generate native iOS project
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile"
          pnpm exec expo prebuild --platform ios --clean --no-install
      - name: Install current CocoaPods and project pods
        script: |
          sudo gem install cocoapods --no-document
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          pod install --repo-update
      - name: Reuse Apple distribution signing credentials
        script: |
          keychain initialize
          node -e 'require("fs").writeFileSync("/tmp/remont-certificate-key.pem", process.env.CERTIFICATE_PRIVATE_KEY, {mode:0o600})'
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@file:/tmp/remont-certificate-key.pem --create
          keychain add-certificates
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          xcode-project use-profiles
      - name: Build signed store IPA
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          xcode-project build-ipa --workspace AsystentRemontu.xcworkspace --scheme AsystentRemontu --archive-flags "-destination 'generic/platform=iOS'"
    artifacts:
      - artifacts/mobile/ios/build/ios/ipa/*.ipa
      - artifacts/mobile/ios/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  ios-simulator-smoke:
    name: Remont Asystent — native iPhone acceptance
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        CI: "1"
        MAESTRO_CLI_NO_ANALYTICS: "true"
        MAESTRO_VERSION: "2.12.0"
      node: 22.19.0
      java: 17
      xcode: 26.6
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pnpm-store
        - $HOME/.npm
    scripts:
      - name: Install exact dependencies and generate iOS
        script: |
          npm install -g pnpm@10.17.1
          cd "$CM_BUILD_DIR"
          pnpm install --frozen-lockfile
          cd artifacts/mobile
          pnpm exec expo prebuild --platform ios --clean --no-install
          sudo gem install cocoapods --no-document
          cd ios
          pod install --repo-update
      - name: Build the same application for iPhone Simulator
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          xcodebuild -workspace AsystentRemontu.xcworkspace -scheme AsystentRemontu -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$CM_BUILD_DIR/simulator-build" CODE_SIGNING_ALLOWED=NO > "$CM_BUILD_DIR/simulator-build.log" 2>&1
      - name: Boot iPhone 14 Plus and seed only synthetic project data
        script: |
          cd "$CM_BUILD_DIR"
          RUNTIME_ID=$(xcrun simctl list runtimes available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const rows=JSON.parse(s).runtimes.filter(r=>r.isAvailable&&r.identifier.includes("iOS-")&&r.version.startsWith("26."));if(!rows.length)process.exit(1);console.log(rows[0].identifier);})')
          REMONT_SIM_UDID=$(xcrun simctl create "Remont native acceptance" com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus "$RUNTIME_ID")
          echo "REMONT_SIM_UDID=$REMONT_SIM_UDID" >> "$CM_ENV"
          xcrun simctl boot "$REMONT_SIM_UDID"
          xcrun simctl bootstatus "$REMONT_SIM_UDID" -b
          xcrun simctl install "$REMONT_SIM_UDID" simulator-build/Build/Products/Release-iphonesimulator/AsystentRemontu.app
          xcrun simctl launch "$REMONT_SIM_UDID" app.replit.remontasystent
          python3 scripts/ci/seed-ios-smoke.py "$REMONT_SIM_UDID"
      - name: Native project, real price and screenshot acceptance
        script: |
          cd "$CM_BUILD_DIR"
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p native-screens
          maestro --device "$REMONT_SIM_UDID" test --format junit --output native-smoke.xml scripts/ci/ios-smoke.yaml
    artifacts:
      - native-screens/*.png
      - native-smoke.xml
      - simulator-build.log
      - ~/.maestro/tests/**

  android-release-smoke:
    name: Remont Asystent — frozen release APK acceptance
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - native_acceptance
      vars:
        CI: "1"
        MAESTRO_CLI_NO_ANALYTICS: "true"
        MAESTRO_VERSION: "2.12.0"
      node: 22.19.0
      java: 17
    scripts:
      - name: Verify the exact signed release APK
        script: |
          cd "$CM_BUILD_DIR"
          curl -fL --retry 2 "$REMONT_NATIVE_APK_URL" -o android-qa.apk
          echo "5056d8cc2e0cf68069fbf64b4f7a7ace372ed9275c6ce9e02c70c4feb45567e3  android-qa.apk" | sha256sum -c -
      - name: Boot a disposable rootable Android 15 emulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          trap 'RESULT=$?; tail -n 80 android-emulator.log 2>/dev/null || true; exit "$RESULT"' EXIT
          "$ANDROID_HOME/emulator/emulator" -accel-check
          timeout 600s sdkmanager "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --name RemontNative35 --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd RemontNative35 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -skin 1080x2400 > android-emulator.log 2>&1 < /dev/null &
          timeout 180s adb wait-for-device
          for ATTEMPT in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb root
          timeout 60s adb wait-for-device
          adb shell input keyevent 82
          adb install android-qa.apk
          adb shell am start -n pl.asystentremontu.app/.MainActivity
          python3 scripts/ci/seed-android-smoke.py
      - name: Native release project, real quotes and screenshots
        script: |
          cd "$CM_BUILD_DIR"
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p native-screens
          maestro test --format junit --output android-native-smoke.xml scripts/ci/android-smoke.yaml
          adb logcat -d > android-native-logcat.txt
    artifacts:
      - native-screens/*.png
      - android-native-smoke.xml
      - android-emulator.log
      - android-native-logcat.txt
      - ~/.maestro/tests/**
