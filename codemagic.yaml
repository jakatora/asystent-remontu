  ios-release-ipa:
    name: Remont Asystent 1.2.0 — iOS Store Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store
      vars:
        BUNDLE_ID: app.replit.remontasystent
        APP_STORE_APPLE_ID: "6761497453"
        CI: "1"
      node: 22.19.0
      xcode: 26.6
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pnpm-store
        - $HOME/.npm
    scripts:
      - name: Install exact workspace dependencies
        script: |
          npm install -g pnpm@10.17.1
          cd "$CM_BUILD_DIR"
          pnpm install --frozen-lockfile
      - name: Validate mobile TypeScript
        script: |
          cd "$CM_BUILD_DIR"
          pnpm exec tsc --build lib/pricing-service/tsconfig.json
          pnpm --filter @workspace/mobile typecheck
      - name: Generate native iOS project
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile"
          pnpm exec expo prebuild --platform ios --clean --no-install
      - name: Install current CocoaPods and project pods
        script: |
          sudo gem install cocoapods --no-document
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          pod install --repo-update
      - name: Reuse Apple distribution signing credentials
        script: |
          keychain initialize
          node -e 'require("fs").writeFileSync("/tmp/remont-certificate-key.pem", process.env.CERTIFICATE_PRIVATE_KEY, {mode:0o600})'
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@file:/tmp/remont-certificate-key.pem --create
          keychain add-certificates
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          xcode-project use-profiles
      - name: Build signed store IPA
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          xcode-project build-ipa --workspace AsystentRemontu.xcworkspace --scheme AsystentRemontu --archive-flags "-destination 'generic/platform=iOS'"
    artifacts:
      - artifacts/mobile/ios/build/ios/ipa/*.ipa
      - artifacts/mobile/ios/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  ios-simulator-smoke:
    name: Remont Asystent — native iPhone acceptance
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        CI: "1"
        MAESTRO_CLI_NO_ANALYTICS: "true"
        MAESTRO_VERSION: "2.12.0"
      node: 22.19.0
      java: 17
      xcode: 26.6
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pnpm-store
        - $HOME/.npm
    scripts:
      - name: Install exact dependencies and generate iOS
        script: |
          npm install -g pnpm@10.17.1
          cd "$CM_BUILD_DIR"
          pnpm install --frozen-lockfile
          cd artifacts/mobile
          pnpm exec expo prebuild --platform ios --clean --no-install
          sudo gem install cocoapods --no-document
          cd ios
          pod install --repo-update
      - name: Build the same application for iPhone Simulator
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile/ios"
          xcodebuild -workspace AsystentRemontu.xcworkspace -scheme AsystentRemontu -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$CM_BUILD_DIR/simulator-build" CODE_SIGNING_ALLOWED=NO > "$CM_BUILD_DIR/simulator-build.log" 2>&1
      - name: Archive the exact simulator application for test-only retries
        script: |
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          import pathlib,plistlib,json
          path=pathlib.Path('simulator-build/Build/Products/Release-iphonesimulator/AsystentRemontu.app/Info.plist')
          data=plistlib.loads(path.read_bytes())
          assert data['CFBundleShortVersionString']=='1.2.1' and data['CFBundleVersion']=='11'
          pathlib.Path('simulator-app-source.json').write_text(json.dumps({'applicationSourceCommit':'feff7c19e9646f29b5356577cc337d342c5e3c1e','version':'1.2.1','build':'11'}))
          PY
          tar -czf simulator-app.tar.gz -C simulator-build/Build/Products/Release-iphonesimulator AsystentRemontu.app
          shasum -a 256 simulator-app.tar.gz > simulator-app.sha256
      - name: Boot iPhone 14 Plus and seed only synthetic project data
        script: |
          cd "$CM_BUILD_DIR"
          RUNTIME_ID=$(xcrun simctl list runtimes available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const rows=JSON.parse(s).runtimes.filter(r=>r.isAvailable&&r.identifier.includes("iOS-")&&r.version.startsWith("26."));if(!rows.length)process.exit(1);console.log(rows[0].identifier);})')
          REMONT_SIM_UDID=$(xcrun simctl create "Remont native acceptance" com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus "$RUNTIME_ID")
          echo "REMONT_SIM_UDID=$REMONT_SIM_UDID" >> "$CM_ENV"
          xcrun simctl boot "$REMONT_SIM_UDID"
          xcrun simctl bootstatus "$REMONT_SIM_UDID" -b
          xcrun simctl install "$REMONT_SIM_UDID" simulator-build/Build/Products/Release-iphonesimulator/AsystentRemontu.app
          xcrun simctl launch "$REMONT_SIM_UDID" app.replit.remontasystent
          python3 scripts/ci/seed-ios-smoke.py "$REMONT_SIM_UDID"
      - name: Native project, real price and screenshot acceptance
        script: |
          cd "$CM_BUILD_DIR"
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p native-screens
          maestro --device "$REMONT_SIM_UDID" test --config scripts/ci/ios-native/config.yaml --format junit --output native-smoke.xml scripts/ci/ios-native
    artifacts:
      - native-screens/*.png
      - native-smoke.xml
      - simulator-build.log
      - simulator-app.tar.gz
      - simulator-app.sha256
      - simulator-app-source.json
      - ~/.maestro/tests/**

  android-release-smoke:
    name: Remont Asystent — frozen release APK acceptance
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - native_acceptance
      vars:
        CI: "1"
        MAESTRO_CLI_NO_ANALYTICS: "true"
        MAESTRO_VERSION: "2.12.0"
      node: 22.19.0
      java: 17
    scripts:
      - name: Verify the exact signed release APK
        script: |
          cd "$CM_BUILD_DIR"
          curl -fL --retry 2 "$REMONT_NATIVE_APK_11_URL" -o android-qa.apk
          echo "3ec719d02e17d09be6a60286a3e4d8067f7b36fb9081445d8b07975ceb1b0efb  android-qa.apk" | sha256sum -c -
      - name: Boot a disposable rootable Android 15 emulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          trap 'RESULT=$?; adb logcat -d > android-native-logcat.txt 2>&1 || true; tail -n 80 android-emulator.log 2>/dev/null || true; exit "$RESULT"' EXIT
          "$ANDROID_HOME/emulator/emulator" -accel-check
          REMONT_SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$REMONT_SDK_BIN/sdkmanager" ]; then
            REMONT_SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
            REMONT_SDK_BIN=$(dirname "$REMONT_SDK_MANAGER")
          fi
          test -x "$REMONT_SDK_BIN/sdkmanager"
          test -x "$REMONT_SDK_BIN/avdmanager"
          timeout 600s "$REMONT_SDK_BIN/sdkmanager" "system-images;android-35;google_apis;x86_64"
          echo no | "$REMONT_SDK_BIN/avdmanager" create avd --name RemontNative35 --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd RemontNative35 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -skin 1080x2400 > android-emulator.log 2>&1 < /dev/null &
          timeout 180s adb wait-for-device
          for ATTEMPT in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb root
          timeout 60s adb wait-for-device
          adb shell input keyevent 82
          adb install android-qa.apk
          adb shell am start -n pl.asystentremontu.app/.MainActivity
          python3 scripts/ci/seed-android-smoke.py
      - name: Native release project, real quotes and screenshots
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          trap 'adb logcat -d > android-native-logcat.txt 2>&1 || true' EXIT
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p native-screens
          maestro test --config scripts/ci/android-native/config.yaml --format junit --output android-native-smoke.xml scripts/ci/android-native
    artifacts:
      - native-screens/*.png
      - android-native-smoke.xml
      - android-emulator.log
      - android-native-logcat.txt
      - ~/.maestro/tests/**

  android-store-patch:
    name: Remont Asystent 1.2.1 — signed Android fallback
    instance_type: linux_x2
    max_build_duration: 90
    environment:
      android_signing:
        - asystent_remontu_keystore
      vars:
        CI: "1"
      node: 22.19.0
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.pnpm-store
    scripts:
      - name: Install exact workspace dependencies
        script: |
          npm install -g pnpm@10.17.1
          cd "$CM_BUILD_DIR"
          pnpm install --frozen-lockfile
      - name: Generate the frozen Android application
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile"
          pnpm exec expo prebuild --platform android --clean --no-install
      - name: Use the existing application signing identity
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile/android/app"
          python3 <<'PY'
          import os,pathlib
          assert all(os.environ.get(k) for k in ['CM_KEYSTORE_PATH','CM_KEYSTORE_PASSWORD','CM_KEY_ALIAS','CM_KEY_PASSWORD'])
          assert pathlib.Path(os.environ['CM_KEYSTORE_PATH']).is_file()
          block="""
          android {
            signingConfigs {
              remontStore {
                storeFile file(System.getenv('CM_KEYSTORE_PATH'))
                storePassword System.getenv('CM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CM_KEY_ALIAS')
                keyPassword System.getenv('CM_KEY_PASSWORD')
              }
            }
            buildTypes { release { signingConfig signingConfigs.remontStore } }
          }
          """
          with pathlib.Path('build.gradle').open('a') as target: target.write(block)
          PY
      - name: Build signed APK and AAB from the same code
        script: |
          cd "$CM_BUILD_DIR/artifacts/mobile/android"
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Require the currently published upload certificate
        script: |
          cd "$CM_BUILD_DIR"
          python3 <<'PY'
          import os,pathlib,subprocess,re,json
          tools=sorted(pathlib.Path(os.environ['ANDROID_HOME'],'build-tools').glob('*/apksigner'))
          assert tools
          apk=pathlib.Path('artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk')
          raw=subprocess.check_output([str(tools[-1]),'verify','--print-certs',str(apk)],text=True)
          digest=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)',raw).group(1).lower()
          assert digest=='060bb3db364b08c01efce9e72c802d493925c2338d8bf068572c9dd5d02274d4','Signing identity differs from the published application'
          pathlib.Path('android-signing-proof.json').write_text(json.dumps({'publishedUploadCertificateMatched':True,'sha256':digest}))
          print('Published upload certificate matched.')
          PY
    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/release/*.apk
      - artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
      - android-signing-proof.json
