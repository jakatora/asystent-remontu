appId: app.replit.remontasystent
---
- extendedWaitUntil:
    visible: Kopie remontów i budowy domu
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Wybierz plik z kopią
    direction: DOWN
    timeout: 30000
- tapOn: Wybierz plik z kopią
- takeScreenshot: native-screens/13-ios-import-picker
# The iOS 26.5 picker opens on an empty Recents tab for this fixture.
- tapOn:
    point: '70%,95%'
- tapOn:
    text: '^On My iPhone$'
    optional: true
- takeScreenshot: native-screens/13b-ios-import-browse
- extendedWaitUntil:
    visible: '^remont-qa-ios-import(\.json)?$'
    timeout: 30000
# Tapping the filename label leaves the iOS 26.5 picker open. Tap the file
# thumbnail observed at [287,201][418,294] on this fixed iPhone 14 Plus fixture.
- tapOn:
    point: '82%,27%'
- extendedWaitUntil:
    visible: '^Do wczytania: 1 projekt.w, 0 pozycji zakup.w, 1 zdj..$'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: Wczytaj projekty z kopii
    direction: DOWN
    timeout: 30000
- assertVisible: QA Kopia iOS
- tapOn: Wczytaj projekty z kopii
- extendedWaitUntil:
    visible: '.*Przeniesiono projektów: 1.*'
    timeout: 30000
- takeScreenshot: native-screens/14-ios-import-confirmed
