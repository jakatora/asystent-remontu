appId: app.replit.remontasystent
---
- launchApp:
    clearState: false
- tapOn:
    text: Pomiń
    optional: true
- assertVisible: Remont Asystent
- takeScreenshot: native-screens/01-home
- openLink:
    link: remont://project/paint-base?tab=estimate
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: 'Gdzie kupisz najtaniej\?'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: Kod pocztowy dostawy
    direction: DOWN
    timeout: 30000
- tapOn: Kod pocztowy dostawy
- inputText: 30001
- takeScreenshot: native-screens/02-postcode-entered
- tapOn:
    point: "50%,25%"
- extendedWaitUntil:
    notVisible: Sprawdzamy koszyki sklepów i koszty dostawy…
    timeout: 180000
- scrollUntilVisible:
    element:
      text: Łączny koszt
    direction: DOWN
    timeout: 180000
- assertVisible: Łączny koszt
- takeScreenshot: native-screens/03-paint-with-delivery
