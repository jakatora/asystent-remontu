appId: app.replit.remontasystent
---
- openLink: remont://project-backup
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: Kopie remontów i budowy domu
    timeout: 30000
- tapOn: Zapisz lub udostępnij kopię
- extendedWaitUntil:
    visible: '.*asystent-remontu-projekty.*'
    timeout: 30000
- takeScreenshot: native-screens/09-backup-share
- assertVisible: '^Save to Files$'
# The iOS 26.5 share sheet reports the label in remote-view coordinates.
# Tap the actual folder icon shown on the pinned iPhone 14 Plus simulator.
- tapOn:
    point: '39%,89%'
# The remote Files sheet is visible but does not expose its Save button to Maestro.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: native-screens/ios-files-picker-renovation
- tapOn:
    point: '87%,11%'
- extendedWaitUntil:
    visible: Kopie remontów i budowy domu
    timeout: 30000
- takeScreenshot: native-screens/10-backup-saved
