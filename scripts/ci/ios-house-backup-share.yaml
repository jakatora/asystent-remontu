appId: app.replit.remontasystent
---
- openLink: remont://project-backup
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: Kopie remontĂłw i budowy domu
    timeout: 30000
- tapOn: Zapisz lub udostÄ™pnij kopiÄ™
- extendedWaitUntil:
    visible: '.*asystent-remontu-budowa-domu.*'
    timeout: 30000
- takeScreenshot: native-screens/11-house-backup-share
- assertVisible: '^Save to Files$'
# The iOS 26.5 share sheet reports the label in remote-view coordinates.
# Tap the actual folder icon shown on the pinned iPhone 14 Plus simulator.
- tapOn:
    point: '39%,89%'
- extendedWaitUntil:
    visible: '^Save$'
    timeout: 30000
- tapOn: '^Save$'
- extendedWaitUntil:
    visible: Kopie remontĂłw i budowy domu
    timeout: 30000
- takeScreenshot: native-screens/12-house-backup-saved
