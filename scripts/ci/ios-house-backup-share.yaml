appId: app.replit.remontasystent
---
# The preceding renovation export can leave this screen open.
- runFlow:
    when:
      notVisible: '^Projekty budowy domu: 1\..*'
    commands:
      - openLink: remont://project-backup
      - tapOn:
          text: '^Open$'
          optional: true
- extendedWaitUntil:
    visible: '^Projekty budowy domu: 1\..*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Zapisz kopi. budowy domu'
    direction: DOWN
    timeout: 30000
- tapOn: 'Zapisz kopi. budowy domu'
- extendedWaitUntil:
    visible: '.*asystent-remontu-budowa-domu.*'
    timeout: 30000
- takeScreenshot: native-screens/11-house-backup-share
- assertVisible: '^Save to Files$'
# Tap the folder icon shown on the pinned iPhone 14 Plus simulator.
- tapOn:
    point: '39%,89%'
- extendedWaitUntil:
    visible: '^Save$'
    timeout: 30000
- tapOn: '^Save$'
- extendedWaitUntil:
    visible: 'Zapisz kopi. budowy domu'
    timeout: 30000
- takeScreenshot: native-screens/12-house-backup-saved
