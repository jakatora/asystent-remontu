appId: pl.asystentremontu.app
---
- openLink: remont://project-backup
- extendedWaitUntil:
    visible: Kopie remontów i budowy domu
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Wybierz plik z kopią
    direction: DOWN
    timeout: 30000
- tapOn: Wybierz plik z kopią
# The Android 15 file picker can reopen on Recent after the renovation
# import. Tap the observed toolbar button to explicitly open Downloads.
- extendedWaitUntil:
    visible: '^(Recent|Recent files|Ostatnie|Ostatnie pliki|Downloads|Pobrane)$'
    timeout: 15000
- tapOn:
    point: '7%,8%'
- extendedWaitUntil:
    visible: '^(Downloads|Pobrane)$'
    timeout: 15000
# Match the drawer row, not the Downloads breadcrumb underneath the drawer.
# The previous text-only selector tapped Recent at the breadcrumb coordinates.
- tapOn:
    id: 'android:id/title'
    text: '^(Downloads|Pobrane)$'
- takeScreenshot: native-screens/10b-house-import-downloads
# The grid also exposes a preview action with the filename in its label.
# Use list mode when available and select only the exact file title.
- tapOn:
    id: 'com.google.android.documentsui:id/sub_menu_list'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'android:id/title'
      text: '^remont-qa-house\.json$'
    timeout: 30000
- tapOn:
    id: 'android:id/title'
    text: '^remont-qa-house\.json$'
- extendedWaitUntil:
    visible: '^Do wczytania: 1 projekt.w budowy domu$'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: Wczytaj projekty budowy domu
    direction: DOWN
    timeout: 30000
- assertVisible: QA Budowa Android
- tapOn: Wczytaj projekty budowy domu
- extendedWaitUntil:
    visible: '^Przywrócono projekty budowy domu: 1\.$'
    timeout: 30000
- takeScreenshot: native-screens/11-house-backup-restored
