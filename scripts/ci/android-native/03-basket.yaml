appId: pl.asystentremontu.app
---
- launchApp:
    clearState: false
# Dismiss only the observed unrelated emulator launcher dialog; application ANRs remain test failures.
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: Close app
- extendedWaitUntil:
    visible: Remont Asystent
    timeout: 60000
- tapOn:
    text: Projekty
    rightOf:
      text: Odkryj
- extendedWaitUntil:
    visible: Twoje projekty
    timeout: 60000
- scrollUntilVisible:
    element:
      text: '.*Malowanie 40,5.*osobny grunt.*'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: '.*Malowanie 40,5.*osobny grunt.*'
- extendedWaitUntil:
    visible: Gdzie najtaniej
    timeout: 60000
- tapOn: Gdzie najtaniej
- extendedWaitUntil:
    visible: 'Gdzie kupisz najtaniej\?'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: Kod pocztowy dostawy
    direction: DOWN
    timeout: 30000
- tapOn: Kod pocztowy dostawy
- inputText: 30001
- takeScreenshot: native-screens/02-postcode-entered
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Twoje zakupy
    direction: UP
    timeout: 30000
# The total is now shown upfront, above the postcode. Require a real quote,
# its materials/delivery split and the requested destination instead of scrolling
# past this overview to the old detailed-total label.
- extendedWaitUntil:
    visible: 'Materiały: .*zł.*dostawa.*zł'
    timeout: 180000
- assertVisible: 'Z dostawą do 30-001.*'
- assertVisible: 'Porównanie obejmuje potwierdzone wyceny.*'
- takeScreenshot: native-screens/03-paint-with-delivery
