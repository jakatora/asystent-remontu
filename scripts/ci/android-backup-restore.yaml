appId: pl.asystentremontu.app
---
- openLink: remont://project-backup
- extendedWaitUntil:
    visible: Kopie remontów i budowy domu
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Wybierz plik z kopią
    direction: DOWN
    timeout: 30000
- tapOn: Wybierz plik z kopią
- tapOn:
    text: '^(Show roots|Pokaż katalogi|Open navigation drawer)$'
    optional: true
- tapOn:
    text: '^(Downloads|Pobrane)$'
    optional: true
# The grid also exposes a preview action with the filename in its label.
# Use list mode when available and select only the exact file title.
- tapOn:
    id: 'com.google.android.documentsui:id/sub_menu_list'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'android:id/title'
      text: '^remont-qa-import\.json$'
    timeout: 30000
- tapOn:
    id: 'android:id/title'
    text: '^remont-qa-import\.json$'
- extendedWaitUntil:
    visible: Kopie remontów i budowy domu
    timeout: 15000
- scrollUntilVisible:
    element:
      text: Wczytaj projekty z kopii
    direction: DOWN
    timeout: 30000
- assertVisible: QA Kopia Android
- tapOn: Wczytaj projekty z kopii
- extendedWaitUntil:
    visible: '.*Przeniesiono projektów: 1.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Zobacz przywrócone projekty
    direction: DOWN
    timeout: 30000
- tapOn: Zobacz przywrócone projekty
- tapOn: QA Kopia Android
- tapOn: Zdjęcia
- extendedWaitUntil:
    visible: '\(1\)'
    timeout: 30000
- takeScreenshot: native-screens/10-backup-restored
